name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端（lint / 类型 / 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # JWT_SECRET 有 >=32 的启动校验：写短了应用根本起不来（CI 曾在此失败）
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      APP_DB_PASSWORD: aics_app
      DATABASE_URL: postgresql+asyncpg://aics_app:aics_app@localhost:5432/aics_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aics_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: 迁移
        run: uv run alembic upgrade head
      - name: pytest（含 RLS 跨租户隔离验证）
        run: uv run pytest -q

  frontend:
    name: 前端（lint / 类型 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 与 frontend/pnpm-lock.yaml（lockfileVersion 9.0）及 Dockerfile.web 保持同版本，
          # 大版本不一致时 --frozen-lockfile 可能直接失败
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # 锁文件在子目录，不指定路径时 setup-node 只在仓库根找，会直接报
          # "Dependencies lock file is not found"（前端 job 曾在此失败）
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint:check
      - name: 类型检查
        run: pnpm typecheck
      - name: 构建
        run: pnpm build
