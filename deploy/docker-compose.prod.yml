# 生产部署（Docker Compose）。
#
# 用法（deploy 目录下放好 .env 后，在仓库根目录执行）：
#   cp deploy/.env.prod.example deploy/.env   # 然后填 JWT_SECRET、各密钥与密码
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env logs -f api
#
# 要点：
# - 数据库与 Redis 不映射宿主机端口：只在 compose 网络内可达，减少暴露面
# - migrate 是一次性服务：跑完 alembic upgrade head 就退出，api 等它成功才启动
# - api 与 worker 用同一个镜像（command 不同），上传目录共用 uploads_data 卷
# - .env 已被 .gitignore 忽略，不要提交
#
# 项目名必须独立于开发栈（deploy/docker-compose.yml）：同主机上若项目名相同，
# compose 会把两边当成同一个 project，数据卷（deploy_postgres_data）会被共用，
# 生产起来时会直接挂到开发库上。
name: aics-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aics-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: aics-prod-redis
    restart: unless-stopped
    # appendonly：队列与限流计数不能因重启丢失
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: aics-api:prod
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: aics-api:prod
    command:
      ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${API_WORKERS:-2}"]
    env_file: .env
    environment:
      API_WORKERS: ${API_WORKERS:-2}
    volumes:
      - uploads_data:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: aics-api:prod
    # arq worker：文档解析、渠道入站、邮件轮询（cron）与访客清理都在这里
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file: .env
    volumes:
      - uploads_data:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: aics-web:prod
    ports:
      # 80 只保留 HTTP-01 校验与 301 跳转；业务全部走 443
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      # 证书：certbot 签发的 fullchain.pem / privkey.pem 放这里
      - ./certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 定时备份（宿主机没有 cron/systemd 时的兜底）。
  # Linux 宿主机更推荐 deploy/systemd/aics-backup.timer，可以把这个服务删掉。
  backup:
    # 复用 postgres 镜像：自带 pg_dump/gzip，不必再拉一个带客户端的镜像
    image: pgvector/pgvector:pg16
    container_name: aics-prod-backup
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # 容器内没有 docker，走 pg_dump 直连分支
      POSTGRES_HOST: postgres
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
      - ./backup-loop.sh:/backup-loop.sh:ro
      # 恢复脚本一起挂进来：演练/救急时直接 docker compose exec backup bash /restore.sh <文件>
      - ./restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backups:
  certbot_webroot:
