# 80 与 443 两个 server 共用的配置（避免复制两份后改一处漏一处）。
# root 必须写在这里：不写时 nginx 回落到 prefix 下的 html/（/etc/nginx/html），
# 静态文件会全部 404，而且只在把配置拆成 include 之后才暴露。
root /usr/share/nginx/html;
index index.html;

# 带指纹的构建产物可长缓存；index.html 必须不缓存，否则发版后用户仍拿旧入口
location = /index.html {
    add_header Cache-Control "no-store";
}
location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
}

# API 与 SSE 全部走反代。
# SSE 三条必开：关闭缓冲（否则事件攒在缓冲区里，前端永远在 loading）、
# HTTP/1.1（长连接复用）、长 read timeout（生成可能持续几十秒）。
location /api/ {
    proxy_pass http://aics_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 反代后的真实协议：应用据此判断 cookie 是否该带 Secure
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
}

# SPA 回退：除 /api 与静态文件外一律回 index.html
location / {
    try_files $uri $uri/ /index.html;
}
