upstream aics_api {
    server api:8000;
    keepalive 32;
}

# HTTP：只保留证书签发校验路径，其余统一跳 HTTPS。
# 证书由宿主机 deploy/certs 挂载进来（fullchain.pem + privkey.pem），
# 用 certbot 签发后替换这两个文件即可，无需改本文件。
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 校验必须走 80 端口，不能全量跳走
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：确认长期走 HTTPS 后再打开。开着时若证书出问题，
    # 浏览器会强制拒绝降级访问，连排查窗口都没有。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/app.conf;
}
