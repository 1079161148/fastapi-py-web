# 本地开发基础设施（M0）。
# 端口为宿主机错峰映射：本机 5432/6379/6381 已被其他项目占用，见设计文档第 14 章。
# 凭证经 .env 注入，缺省值仅供本地开发，禁止用于生产。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aics}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    container_name: aics-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # TODO(owner: 项目负责人): MinIO 镜像在当前网络下被镜像源 403 拦截（daocloud 拒绝 minio，
  # 其余加速源不可达），待网络/镜像源解决后取消注释。M0-M4（多租户/对话/知识库/多渠道）
  # 不依赖对象存储，M5 语音客服启用前必须解决：换可达镜像源、改用本地文件系统后端或云 OSS。
